<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AI Image Enhancer</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f5f7fb;
            color: #1f2937;
        }

        header {
            background: #111827;
            color: white;
            padding: 22px 60px;
        }

        header h1 {
            font-size: 24px;
        }

        header p {
            margin-top: 5px;
            color: #9ca3af;
            font-size: 14px;
        }

        .container {
            max-width: 1000px;
            margin: 45px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 35px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.07);
        }

        .title {
            text-align: center;
            margin-bottom: 30px;
        }

        .title h2 {
            font-size: 30px;
            margin-bottom: 8px;
        }

        .title p {
            color: #6b7280;
        }

        .upload-area {
            display: block;
            border: 2px dashed #cbd5e1;
            border-radius: 14px;
            padding: 45px 20px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
        }

        .upload-area:hover {
            border-color: #4f46e5;
            background: #f8f8ff;
        }

        .upload-icon {
            font-size: 45px;
            margin-bottom: 15px;
        }

        .upload-area h3 {
            margin-bottom: 8px;
        }

        .upload-area p {
            color: #6b7280;
            font-size: 14px;
        }

        input[type="file"] {
            display: none;
        }

        .file-name {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
            font-weight: bold;
            color: #4f46e5;
        }

        .preview-container {
            display: none;
            margin-top: 30px;
        }

        .preview-container h3 {
            margin-bottom: 15px;
        }

        .preview-image {
            display: block;
            width: 100%;
            max-height: 400px;
            object-fit: contain;
            border-radius: 12px;
            background: #f3f4f6;
        }

        .button-container {
            text-align: center;
            margin-top: 30px;
        }

        button {
            border: none;
            background: #4f46e5;
            color: white;
            padding: 14px 35px;
            border-radius: 9px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #4338ca;
        }

        button:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 25px;
        }

        .spinner {
            width: 35px;
            height: 35px;
            border: 4px solid #e5e7eb;
            border-top: 4px solid #4f46e5;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: auto;
        }

        @keyframes spin {

            100% {
                transform: rotate(360deg);
            }

        }

        .loading p {
            margin-top: 10px;
            color: #6b7280;
        }

        .result {
            display: none;
            margin-top: 35px;
            padding-top: 30px;
            border-top: 1px solid #e5e7eb;
        }

        .result h3 {
            margin-bottom: 15px;
        }

        .result-image {
            display: block;
            width: 100%;
            max-height: 500px;
            object-fit: contain;
            border-radius: 12px;
            background: #f3f4f6;
        }

        .download-btn {
            display: inline-block;
            margin-top: 20px;
            background: #111827;
            color: white;
            padding: 12px 22px;
            border-radius: 8px;
            text-decoration: none;
        }

        .error {
            display: none;
            margin-top: 20px;
            padding: 14px;
            border-radius: 8px;
            background: #fee2e2;
            color: #991b1b;
        }

        .info {
            margin-top: 25px;
            display: flex;
            justify-content: center;
            gap: 40px;
            color: #6b7280;
            font-size: 14px;
        }

        @media (max-width: 700px) {

            header {
                padding: 20px;
            }

            .container {
                margin-top: 25px;
            }

            .card {
                padding: 22px;
            }

            .info {
                flex-direction: column;
                gap: 8px;
                align-items: center;
            }

        }

    </style>

</head>


<body>


<header>

    <h1>AI Image Enhancer</h1>

    <p>
        Enhance image quality using AI
    </p>

</header>


<div class="container">

    <div class="card">


        <div class="title">

            <h2>
                Enhance Your Image
            </h2>

            <p>
                Upload an image and let AI improve its quality.
            </p>

        </div>


        <!-- IMAGE UPLOAD -->

        <label
                class="upload-area"
                for="imageInput">

            <div class="upload-icon">
                🖼️
            </div>

            <h3>
                Choose an image
            </h3>

            <p>
                Click here to upload JPG, JPEG or PNG
            </p>

            <input
                    type="file"
                    id="imageInput"
                    accept="image/*"
            >

        </label>


        <div
                class="file-name"
                id="fileName">
        </div>


        <!-- ORIGINAL IMAGE -->

        <div
                class="preview-container"
                id="previewContainer">

            <h3>
                Original Image
            </h3>

            <img
                    id="previewImage"
                    class="preview-image"
                    alt="Original Image"
            >

        </div>


        <!-- BUTTON -->

        <div class="button-container">

            <button
                    id="enhanceButton"
                    onclick="enhanceImage()"
                    disabled>

                Enhance Image

            </button>

        </div>


        <!-- LOADING -->

        <div
                class="loading"
                id="loading">

            <div class="spinner"></div>

            <p>
                AI is enhancing your image...
            </p>

        </div>


        <!-- ERROR -->

        <div
                class="error"
                id="error">
        </div>


        <!-- RESULT -->

        <div
                class="result"
                id="result">

            <h3>
                Enhanced Image
            </h3>

            <img
                    id="resultImage"
                    class="result-image"
                    alt="Enhanced Image"
            >

            <a
                    id="downloadButton"
                    class="download-btn"
                    target="_blank">

                Open Enhanced Image

            </a>

        </div>


        <!-- PROJECT INFO -->

        <div class="info">

            <span>
                ⚡ AI Powered
            </span>

            <span>
                🔒 Secure API
            </span>

        </div>


    </div>

</div>


<script>


    // Get HTML elements

    const imageInput =
        document.getElementById("imageInput");

    const fileName =
        document.getElementById("fileName");

    const previewContainer =
        document.getElementById("previewContainer");

    const previewImage =
        document.getElementById("previewImage");

    const enhanceButton =
        document.getElementById("enhanceButton");

    const loading =
        document.getElementById("loading");

    const result =
        document.getElementById("result");

    const resultImage =
        document.getElementById("resultImage");

    const downloadButton =
        document.getElementById("downloadButton");

    const error =
        document.getElementById("error");


    // When user selects an image

    imageInput.addEventListener(
        "change",
        function () {

            const file =
                imageInput.files[0];

            if (!file) {
                return;
            }


            // Show file name

            fileName.textContent =
                "Selected: " + file.name;


            // Show original image

            previewImage.src =
                URL.createObjectURL(file);

            previewContainer.style.display =
                "block";


            // Enable button

            enhanceButton.disabled =
                false;


            // Clear previous result

            result.style.display =
                "none";

            error.style.display =
                "none";

        }
    );


    // Send image to Spring Boot

    async function enhanceImage() {

        const file =
            imageInput.files[0];


        if (!file) {

            return;

        }


        // Create multipart form data

        const formData =
            new FormData();


        // IMPORTANT:
        // "image" must match
        // @RequestParam("image")

        formData.append(
            "image",
            file
        );


        // Show loading

        enhanceButton.disabled =
            true;

        loading.style.display =
            "block";

        result.style.display =
            "none";

        error.style.display =
            "none";


        try {


            // Call Spring Boot API

            const response =
                await fetch(
                    "/api/images/enhance",
                    {
                        method: "POST",

                        body: formData
                    }
                );


            // Convert JSON response

            const data =
                await response.json();


            // Handle backend error

            if (!response.ok) {

                throw new Error(
                    data.error ||
                    "Image enhancement failed"
                );

            }


            // Display enhanced image

            resultImage.src =
                data.enhancedImageUrl;


            // Set download/open link

            downloadButton.href =
                data.enhancedImageUrl;


            // Show result

            result.style.display =
                "block";


        } catch (err) {


            // Show error message

            error.textContent =
                err.message;

            error.style.display =
                "block";


        } finally {


            // Hide loading

            loading.style.display =
                "none";


            // Enable button again

            enhanceButton.disabled =
                false;

        }

    }

</script>


</body>

</html>
